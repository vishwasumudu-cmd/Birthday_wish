<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Ishani 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --pink:#ff4f81;
  --purple:#8e44ad;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white;
  text-align:center;
  height:100vh;
  overflow:hidden;
}

/* LOCK SCREEN */
#lock{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input{
  padding:14px;
  border:none;
  border-radius:30px;
  text-align:center;
  width:220px;
}

button{
  margin-top:10px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff4f81;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

/* MAIN CONTENT */
#content{
  display:none;
  padding:20px;
  max-width:500px;
  margin:auto;
  position:relative;
  top:50%;
  transform:translateY(-50%);
  animation:fadeIn 2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(-50%);}
}

h1{
  font-size:38px;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px white;}
  to{ text-shadow:0 0 25px pink;}
}

.message{
  font-size:18px;
  line-height:1.7;
  margin-top:20px;
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-10px;
  font-size:20px;
  animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(0); opacity:1;}
  100%{transform:translateY(-100vh); opacity:0;}
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <h2>🔒 Only Ishani 💌</h2>
  <input type="password" id="pass" placeholder="Enter secret">
  <button onclick="check()">Unlock 💖</button>
  <p id="error"></p>
</div>

<!-- CONTENT -->
<div id="content">
  <h1>Ishani 💖</h1>

  <div class="message">
    I'm really sorry... 😔 <br><br>

    I didn’t mean to hurt you.  
    I made mistakes… but losing you is something I can't accept.  

    Every moment without you feels empty...  

    Please forgive me ❤️  

    Let’s fix everything... together again 💫  
  </div>
</div>

<script>
function check(){
  let password = document.getElementById("pass").value;

  if(password === "wish"){
    document.getElementById("lock").style.display="none";
    document.getElementById("content").style.display="block";
    startHearts();
  }else{
    document.getElementById("error").innerText="Wrong password 😢";
  }
}

/* HEART ANIMATION */
function startHearts(){
  setInterval(()=>{
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*20) + "px";
    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },6000);

  },400);
}
</script>

</body>
</html>
